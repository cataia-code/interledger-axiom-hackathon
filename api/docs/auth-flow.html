<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom · Flujo de registro e inicio de sesión</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1b1e2b;--muted:#6b7185;--line:#9aa1b8;--buyer:#1f9d68;--seller:#e08a00;--err:#d6454f;--accent:#5b5bf0;--fill:#fff;}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1a;--card:#161a2b;--text:#e8ebf7;--muted:#8a91ab;--line:#5d6482;--fill:#1d2238;}}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 40%,transparent);border-radius:16px;padding:12px}
svg{width:100%;height:auto;display:block}
.b{fill:var(--fill);stroke-width:2}
.b.buyer{stroke:var(--buyer)}.b.seller{stroke:var(--seller)}.b.ok{stroke:var(--buyer);fill:color-mix(in srgb,var(--buyer) 12%,var(--fill))}
.b.err{stroke:var(--err);fill:color-mix(in srgb,var(--err) 10%,var(--fill))}.b.neutral,.b.start{stroke:var(--accent)}
.b.start{fill:color-mix(in srgb,var(--accent) 14%,var(--fill))}.b.opt{stroke:var(--line)}.b.dec{stroke:var(--accent)}
.dash{stroke-dasharray:6 5}
.t{font:700 13.5px system-ui,sans-serif;fill:var(--text)}.m{font:10.5px ui-monospace,Menlo,monospace;fill:var(--muted)}
.l{stroke:var(--line);stroke-width:2}.lb{font:700 10.5px system-ui;fill:var(--muted);letter-spacing:.06em}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;vertical-align:-1px;margin-right:6px}
</style></head><body><div class="wrap">
<h1>Registro e inicio de sesión</h1>
<p>Flujo completo de autenticación de la API Axiom. El rol lo define la ruta; la respuesta siempre trae <code>token</code> y <code>user.role</code>.</p>
<div class="card"><svg viewBox="0 0 1000 925" role="img" aria-label="Diagrama del flujo de registro e inicio de sesión">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa1b8"/></marker></defs>
<rect class="b start" x="380" y="20" width="240" height="50" rx="12"/>
<text class="t" x="500.0" y="50.0" text-anchor="middle">Pantalla de acceso</text>
<path class="l" d="M500 70 V100" fill="none" marker-end="url(#a)"/>
<path class="l" d="M135 100 H875" fill="none"/>
<text class="lb" x="250" y="92" text-anchor="middle">NUEVO USUARIO</text>
<text class="lb" x="750" y="92" text-anchor="middle">YA TENGO CUENTA</text>
<path class="l" d="M135 100 V130" fill="none" marker-end="url(#a)"/>
<path class="l" d="M365 100 V130" fill="none" marker-end="url(#a)"/>
<path class="l" d="M625 100 V130" fill="none" marker-end="url(#a)"/>
<path class="l" d="M875 100 V130" fill="none" marker-end="url(#a)"/>
<rect class="b buyer" x="30" y="130" width="210" height="90" rx="12"/>
<text class="t" x="135.0" y="165.0" text-anchor="middle">Registro comprador</text>
<text class="m" x="135.0" y="182.0" text-anchor="middle">POST /auth/buyer/sign-up</text>
<text class="m" x="135.0" y="197.0" text-anchor="middle">email · password · name</text>
<rect class="b seller" x="260" y="130" width="210" height="90" rx="12"/>
<text class="t" x="365.0" y="157.5" text-anchor="middle">Registro vendedor</text>
<text class="m" x="365.0" y="174.5" text-anchor="middle">POST /auth/seller/sign-up</text>
<text class="m" x="365.0" y="189.5" text-anchor="middle">usuario + organización</text>
<text class="m" x="365.0" y="204.5" text-anchor="middle">+ sucursal (1 paso)</text>
<rect class="b neutral" x="520" y="130" width="210" height="90" rx="12"/>
<text class="t" x="625.0" y="165.0" text-anchor="middle">Login con contraseña</text>
<text class="m" x="625.0" y="182.0" text-anchor="middle">POST /auth/{rol}/sign-in</text>
<text class="m" x="625.0" y="197.0" text-anchor="middle">email · password</text>
<rect class="b neutral" x="770" y="130" width="210" height="90" rx="12"/>
<text class="t" x="875.0" y="165.0" text-anchor="middle">Login con código OTP</text>
<text class="m" x="875.0" y="182.0" text-anchor="middle">1 send-verification-otp</text>
<text class="m" x="875.0" y="197.0" text-anchor="middle">2 POST /auth/{rol}/sign-in/otp</text>
<path class="l" d="M135 220 V250 H250" fill="none"/>
<path class="l" d="M365 220 V250 H250" fill="none"/>
<path class="l" d="M250 250 V270" fill="none" marker-end="url(#a)"/>
<rect class="b ok" x="150" y="270" width="200" height="46" rx="12"/>
<text class="t" x="250.0" y="298.0" text-anchor="middle">201 → { token, user }</text>
<path class="l" d="M625 220 V250 H750" fill="none"/>
<path class="l" d="M875 220 V250 H750" fill="none"/>
<path class="l" d="M750 250 V268" fill="none" marker-end="url(#a)"/>
<polygon class="b dec" points="750,270.0 835.0,305 750,340.0 665.0,305"/>
<text class="t" x="750" y="310" text-anchor="middle">¿Rol correcto?</text>
<path class="l" d="M835 305 H870" fill="none" marker-end="url(#a)"/>
<text class="lb" x="852" y="297" text-anchor="middle">no</text>
<rect class="b err" x="870" y="280" width="120" height="50" rx="12"/>
<text class="t" x="930.0" y="302.5" text-anchor="middle">403</text>
<text class="m" x="930.0" y="319.5" text-anchor="middle">WRONG_ROLE</text>
<path class="l" d="M750 340 V380" fill="none" marker-end="url(#a)"/>
<text class="lb" x="762" y="364" text-anchor="start">sí</text>
<rect class="b ok" x="650" y="380" width="200" height="46" rx="12"/>
<text class="t" x="750.0" y="408.0" text-anchor="middle">200 → { token, user }</text>
<path class="l dash" d="M150 316 V350" fill="none" marker-end="url(#a)"/>
<text class="lb" x="158" y="338" text-anchor="start">opcional</text>
<rect class="b opt dash" x="40" y="350" width="230" height="74" rx="12"/>
<text class="t" x="155.0" y="377.0" text-anchor="middle">Verificar correo</text>
<text class="m" x="155.0" y="394.0" text-anchor="middle">send-verification-otp</text>
<text class="m" x="155.0" y="409.0" text-anchor="middle">POST /auth/email-otp/verify-email</text>
<path class="l" d="M300 316 V450 H500" fill="none"/>
<path class="l" d="M750 426 V450 H500" fill="none"/>
<path class="l" d="M500 450 V478" fill="none" marker-end="url(#a)"/>
<rect class="b neutral" x="370" y="478" width="260" height="56" rx="12"/>
<text class="t" x="500.0" y="503.5" text-anchor="middle">Guardar en el cliente</text>
<text class="m" x="500.0" y="520.5" text-anchor="middle">token  ·  user.role</text>
<path class="l" d="M500 534 V562" fill="none" marker-end="url(#a)"/>
<rect class="b neutral" x="400" y="562" width="200" height="46" rx="12"/>
<text class="t" x="500.0" y="590.0" text-anchor="middle">GET /me</text>
<path class="l" d="M500 608 V630" fill="none" marker-end="url(#a)"/>
<polygon class="b dec" points="500,630.0 610.0,672 500,714.0 390.0,672"/>
<text class="t" x="500" y="677" text-anchor="middle">user.role?</text>
<path class="l" d="M390 672 H240 V720" fill="none" marker-end="url(#a)"/>
<text class="lb" x="315" y="664" text-anchor="middle">buyer</text>
<path class="l" d="M610 672 H760 V720" fill="none" marker-end="url(#a)"/>
<text class="lb" x="685" y="664" text-anchor="middle">seller</text>
<rect class="b buyer" x="100" y="720" width="280" height="86" rx="12"/>
<text class="t" x="240.0" y="753.0" text-anchor="middle">Comprador</text>
<text class="m" x="240.0" y="770.0" text-anchor="middle">GET /stores · /items</text>
<text class="m" x="240.0" y="785.0" text-anchor="middle">/cart · /orders</text>
<rect class="b seller" x="620" y="720" width="280" height="86" rx="12"/>
<text class="t" x="760.0" y="753.0" text-anchor="middle">Vendedor</text>
<text class="m" x="760.0" y="770.0" text-anchor="middle">/seller/store · /seller/items</text>
<text class="m" x="760.0" y="785.0" text-anchor="middle">/seller/orders · stock</text>
<path class="l dash" d="M240 806 V850 H350" fill="none" marker-end="url(#a)"/>
<path class="l dash" d="M760 806 V850 H650" fill="none" marker-end="url(#a)"/>
<rect class="b err" x="350" y="826" width="300" height="56" rx="12"/>
<text class="t" x="500.0" y="851.5" text-anchor="middle">Cerrar sesión o 401</text>
<text class="m" x="500.0" y="868.5" text-anchor="middle">POST /auth/sign-out → borrar token y rol</text>
<path class="l dash" d="M500 882 V905 H12 V45 H380" fill="none" marker-end="url(#a)"/>
<text class="lb" x="30" y="898" text-anchor="start">volver al inicio</text>
</svg></div>
<div class="legend"><span><i style="border-color:var(--buyer)"></i>Comprador / éxito</span><span><i style="border-color:var(--seller)"></i>Vendedor</span><span><i style="border-color:var(--err)"></i>Error / salida</span><span><i style="border-color:var(--line);border-style:dashed"></i>Opcional</span></div>
</div></body></html>
